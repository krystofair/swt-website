<input type="range" min="-0.5" max="2" step="0.02"
       class="w-75 slider d-inline"
       oninput="this.nextElementSibling.value = this.value" 
       name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value }}"{% endif %}>
<output class="fs-6 d-inline">{{ widget.value }}</output>
